<style>
body{
  margin:0;
  font-family:sans-serif;
  color:white;
  overflow-x:hidden;
}

.hero{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(0.5);
  animation:zoom 12s ease-in-out infinite alternate;
}

@keyframes zoom{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
}

.content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
  max-width:420px;
}

h1{
  font-size:38px;
}

.highlight{
  color:#ff7a00;
}

.cta-btn{
  margin-top:30px;
  display:inline-block;
  padding:20px 40px;
  background:linear-gradient(135deg,#ff7a00,#ff2d00);
  color:white;
  font-weight:bold;
  font-size:20px;
  border-radius:20px;
  text-decoration:none;
}

.tap-hint{
  margin-top:10px;
  font-size:12px;
  opacity:.7;
}

.notif{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
}
</style>
</head>

<body onclick="playSound()">

<div class="hero">

<img src="https://i.ibb.co.com/WWP43400/20260501-155138-0000.jpg">

<div class="overlay"></div>

<div class="content">

Laper? Tenang… MAREM Siap Antar! 😈<br>
<span class="highlight">Jangan Scroll...</span>
</h1>

<p>
Yang klik ini biasanya...<br>
langsung order 😏🔥
</p>

<a href="https://nasgor.nasgor-marem.workers.dev/" class="cta-btn">
JANGAN SCROLL
</a>

<div class="tap-hint">
🔊 Tap layar... ada suara dapur 😁
</div>

</div>

<div class="notif" id="notif">
🔥 Baru saja ada yang klik
</div>

</div>

<audio id="sound" src="https://www.myinstants.com/media/sounds/frying-pan.mp3"></audio>

<script>
function playSound(){
 document.getElementById("sound").play();
}

const notifText = [
 "🔥 Baru saja ada yang klik",
 "🔥 Banyak yang diam-diam order 😏",

setInterval(()=>{
 document.getElementById("notif").innerText =
 notifText[Math.floor(Math.random()*notifText.length)];
},4000);
</script>
